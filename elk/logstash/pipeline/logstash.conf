input {
  file {
    path => "/logs/iot_logs.json"
    start_position => "beginning"
    sincedb_path => "/dev/null"
    codec => "json"
  }
}

filter {
  # Parse timestamp
  date {
    match => [ "timestamp", "ISO8601" ]
    target => "@timestamp"
  }

  # Add computed fields
  mutate {
    add_field => {
      "hour" => "%{+YYYY-MM-dd-HH}"
    }
  }

  # Categorize temperature
  if [temp] {
    if [temp] < 20 {
      mutate { add_field => { "temp_category" => "cold" } }
    } else if [temp] >= 20 and [temp] < 25 {
      mutate { add_field => { "temp_category" => "normal" } }
    } else {
      mutate { add_field => { "temp_category" => "hot" } }
    }
  }

  # Categorize humidity
  if [humidity] {
    if [humidity] < 40 {
      mutate { add_field => { "humidity_category" => "dry" } }
    } else if [humidity] >= 40 and [humidity] < 70 {
      mutate { add_field => { "humidity_category" => "normal" } }
    } else {
      mutate { add_field => { "humidity_category" => "humid" } }
    }
  }

  # Mark errors and warnings for tracking
  if [status] == "ERROR" {
    mutate { add_tag => [ "error" ] }
  } else if [status] == "WARNING" {
    mutate { add_tag => [ "warning" ] }
  }
}

output {
  elasticsearch {
    hosts => ["elasticsearch:9200"]
    index => "iot-logs-%{+YYYY.MM.dd}"
    document_type => "_doc"
  }

  # Output to console for debugging
  stdout {
    codec => rubydebug
  }
}
